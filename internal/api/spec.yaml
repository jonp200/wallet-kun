openapi: 3.1.0
info:
  title: Wallet-kun service
  description: Debits commit atomically before HTTP 200. HTTP 202 is reserved for future Kafka processing.
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /healthz:
    get:
      responses:
        '200':
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        '503':
          $ref: '#/components/responses/error'
  /accounts/{id}/debits:
    post:
      description: A new debit is durably committed before 200. An identical retry returns 200 and the original transaction ID. HTTP 202 is reserved for future Kafka processing. Failed requests do not consume idempotency keys.
      parameters:
        - in: path
          name: id
          required: true
          schema: {$ref: '#/components/schemas/uuid'}
        - in: header
          name: X-Request-ID
          required: true
          schema: {$ref: '#/components/schemas/uuid'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {$ref: '#/components/schemas/uuid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/debit_request'}
      responses:
        '200':
          description: New or identical completed debit; status is completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/debit_response'}
        '202':
          description: Reserved for future Kafka processing; status is accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/debit_response'}
        '400':
          $ref: '#/components/responses/error'
        '403':
          description: Reserved for future authorization
        '404':
          $ref: '#/components/responses/error'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/error'
        '500':
          $ref: '#/components/responses/error'
components:
  responses:
    error:
      description: Error details (400 validation, 404 account missing, 409 key conflict, 422 insufficient funds, 500 internal error, 503 unavailable)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/request_error'}
  schemas:
    uuid:
      type: string
      format: uuid
      description: Nonzero UUID in canonical hyphenated representation
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      not: {const: '00000000-0000-0000-0000-000000000000'}
    debit_request:
      type: object
      additionalProperties: false
      required: [order_reference, amount_minor_units, currency]
      properties:
        order_reference: {$ref: '#/components/schemas/uuid'}
        amount_minor_units:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        currency: {type: string, enum: [PHP]}
    debit_status:
      type: string
      enum: [accepted, completed]
    debit_response:
      type: object
      required: [transaction_id, order_reference, status]
      properties:
        transaction_id: {$ref: '#/components/schemas/uuid'}
        order_reference: {$ref: '#/components/schemas/uuid'}
        status: {$ref: '#/components/schemas/debit_status'}
    request_error:
      type: object
      required: [error]
      properties:
        error: {type: string}
